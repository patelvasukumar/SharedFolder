<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Bouncer List</title>
    </h:head>

    <h:body>
        <h1>Bouncer List</h1>

        <h:form>
            
            <h:messages />

            <h:commandButton
                value="Create Bouncer"
                action="#{bouncerController.prepareCreate}" />

            <h:dataTable
                value="#{bouncerController.items}"
                var="item"
                border="1">

                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{item.id}
                </h:column>

                <h:column>
                    <f:facet name="header">X</f:facet>
                    #{item.x}
                </h:column>

                <h:column>
                    <f:facet name="header">Y</f:facet>
                    #{item.y}
                </h:column>

                <h:column>
                    <f:facet name="header">Y Speed</f:facet>
                    #{item.ySpeed}
                </h:column>

                <h:column>
                    <f:facet name="header">Size</f:facet>
                    #{item.size}
                </h:column>

                <h:column>
                    <f:facet name="header">Actions</f:facet>

                    <h:commandButton
                        value="View"
                        action="#{bouncerController.prepareView(item)}" />

                    <h:commandButton
                        value="Edit"
                        action="#{bouncerController.prepareEdit(item)}" />

                    <h:commandButton
                        value="Delete"
                        action="#{bouncerController.delete(item)}" />
                </h:column>

            </h:dataTable>
        
        </h:form>
    
    </h:body>

</html>
