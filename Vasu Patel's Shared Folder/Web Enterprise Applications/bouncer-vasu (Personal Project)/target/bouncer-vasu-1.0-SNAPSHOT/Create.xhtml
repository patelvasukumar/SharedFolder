<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Create Bouncer</title>
    </h:head>

    <h:body>
        
        <h1>Create Bouncer</h1>

        <h:form>
            <h:messages />

            <h:panelGrid columns="2">

                <h:outputLabel for="x" value="X Position:" />
                <h:inputText id="x"
                             value="#{bouncerController.current.x}"
                             required="true" />

                <h:outputLabel for="y" value="Y Position:" />
                <h:inputText id="y"
                             value="#{bouncerController.current.y}"
                             required="true" />

                <h:outputLabel for="ySpeed" value="Y Speed:" />
                <h:inputText id="ySpeed"
                             value="#{bouncerController.current.ySpeed}"
                             required="true" />

                <h:outputLabel for="size" value="Size:" />
                <h:inputText id="size"
                             value="#{bouncerController.current.size}"
                             required="true" />

            </h:panelGrid>

            <h:commandButton value="Save"
                             action="#{bouncerController.create}" />

            <h:commandButton value="Cancel"
                             action="List?faces-redirect=true"
                             immediate="true" />
        </h:form>
    </h:body>
</html>
